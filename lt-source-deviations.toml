chapter = "BodyPinBlueprint/Chapters/Necessity.lean"
fingerprint = "eeb3bc731e196ad7366c9bd7543c2be1a2a7efb2131ea43ff9a216c68da1d38e"
reason = "The paper argues by contraposition: a partition violating the inequality leaves a nontrivial block twist, which Lemma 6.1 turns into a flex. Lean proves the implication directly, and constructs no flex: twist rigidity makes groupedGroundedBlockOperator injective, so its rank is 6(t-1), and finrank_range_pi_le_sum bounds that rank by the sum of the bundle capacities. Grounding is done by fixing one block's twist to zero rather than by quotienting by the diagonal."

