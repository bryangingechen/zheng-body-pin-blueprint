# Paper <-> Lean divergence register.
#
# Harness format (see tools/verso-harness/references/lt-method.md). Normally
# this records where Verso prose deviates from upstream TeX; here it is turned
# on the paper/Lean seam instead, since there is no TeX source.
#
# `fingerprint` is the SHA-256 the harness computes over a canonicalized `tex`
# witness body, so an entry expires as soon as the witness it excuses changes.
# An entry carries one when there is a single witness it is about. Three kinds
# of entry cannot:
#
#   - the node has no witness at all, as `asimow_roth` deliberately does not;
#   - the entry is about a whole chapter or several results at once;
#   - the chapter is still a stub, so the witness does not exist yet. Add the
#     fingerprint when the chapter lands.
#
# Recompute with:
#   python3 - <<'EOF'
#   import re, sys; sys.path.insert(0, "tools/verso-harness/scripts")
#   from pathlib import Path
#   from check_lt_source_freshness import witness_fingerprint
#   B = re.compile(r'^```tex "([^"]+)"[^\n]*\n(.*?)^```$', re.M | re.S)
#   for p in sorted(Path("BodyPinBlueprint/Chapters").glob("*.lean")):
#       for label, body in B.findall(p.read_text()):
#           print(p.name, label, witness_fingerprint(body))
#   EOF

version = 1

