# Paper -> Lean correspondence
#
# The spine of this blueprint: for each numbered result in the paper, the Lean
# declaration that discharges it. Machine-readable on purpose — `scripts/
# coverage.py` (Phase 2) consumes it, and the audit chapter renders it.
#
# Accuracy note: `lean` names were read off the formalization sources but only
# the Statement-chapter entries have been checked by a real build so far. Treat
# an unchecked `lean` name as a claim to verify, not as fact; `strictResolve` is
# on, so a wrong name fails the build the moment a node cites it.
#
# status:
#   mapped     paper result has a Lean anchor
#   deviation  mapped, but Lean proves it by a different route; see
#              lt-source-deviations.toml
#   informal   in the paper, no Lean counterpart, not load-bearing
#   gap        cited by the paper, not formalized
#   lean-only  in Lean, no paper counterpart
#
# These are exactly the node tags used in the blueprint (see AGENTS.md); the two
# vocabularies are kept in step so the table and the rendered graph can be read
# against each other.
#
# verified = true means a real build has resolved this entry's `lean` names
# under `strictResolve`, or -- for an entry with no `lean` names -- that its node
# exists and its chapter is written. Absent means not yet checked.

version = 1

[paper]
citation = "Zheng, Stress Degeneracy of Direction Complexes of (2,2)-Sparse Graphs and Three-Dimensional Body-Pin Rigidity, August 2026"
doi = "10.13140/RG.2.2.17830.28485"
